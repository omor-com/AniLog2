name: AniLog Android CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build & Test AniLog APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
            distribution: 'temurin'
            java-version: '17'
            cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Ensure Debug Keystore
        run: |
          if [ -f "debug.keystore.base64" ]; then
            echo "Decoding debug.keystore from repository base64 secret..."
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f "debug.keystore" ]; then
            echo "Generating standard debug keystore for CI..."
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          ls -lh debug.keystore

      - name: Validate and Grant Execute Permission to Gradle Wrapper
        run: |
          if [ ! -f "gradlew" ] || [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "WARNING: Gradle wrapper missing from checkout. Generating compatible Gradle 9.3.1 wrapper..."
            gradle wrapper --gradle-version 9.3.1 --distribution-type bin
          fi
          chmod +x gradlew
          ./gradlew -v

      - name: Verify Application ID and Project Identity
        run: |
          echo "Verifying Application ID com.anilog.omor.dev in build configuration..."
          grep -q 'applicationId = "com.anilog.omor.dev"' app/build.gradle.kts || {
            echo "ERROR: Application ID mismatch!"
            exit 1
          }
          echo "SUCCESS: Application ID verified."

      - name: Cache Robolectric Maven Jars
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-robolectric-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-robolectric-

      - name: Run Unit Tests
        run: |
          # Use xvfb-run to provide virtual display for headless AWT / KSP in CI environments
          if command -v xvfb-run > /dev/null 2>&1; then
            xvfb-run -a ./gradlew testDebugUnitTest -Djava.awt.headless=true --stacktrace
          else
            ./gradlew testDebugUnitTest -Djava.awt.headless=true --stacktrace
          fi

      - name: Run Lint Checks
        run: ./gradlew lintDebug --stacktrace

      - name: Assemble Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Verify APK Exists and Non-Empty
        run: |
          echo "Verifying generated APK in app/build/outputs/apk/debug/..."
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "ERROR: Debug APK was not generated!"
            exit 1
          fi
          if [ ! -s "$APK_PATH" ]; then
            echo "ERROR: Generated Debug APK is empty (0 bytes)!"
            exit 1
          fi
          echo "SUCCESS: Found verified APK at $APK_PATH"
          ls -lh "$APK_PATH"

      - name: Upload Debug APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AniLog-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error
